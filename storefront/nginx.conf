server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # PWA: el service worker, el manifiesto e index.html se revisan siempre ("no-cache" = usar, pero preguntar
    # antes si cambió). Si quedaran en caché, el navegador no se enteraría de una versión nueva de la tienda.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        # Tipo explícito: no todas las versiones de nginx traen "webmanifest" en su mime.types.
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Archivos con hash en el nombre (cambian de nombre en cada versión): se pueden guardar un año.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~ ^/workbox-[0-9a-f]+\.js$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
