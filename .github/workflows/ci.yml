name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend (.NET) — unitarios e integración
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Un proyecto a la vez, en vez de depender del formato del .slnx (más portable).
      # Los tests de integración usan Testcontainers — los runners de GitHub ya traen
      # Docker corriendo, así que no hace falta nada especial para eso.
      - name: Restaurar y correr los tests de todos los microservicios
        run: |
          # El patrón es *Tests.csproj (sin punto) para cubrir Cart.UnitTests.csproj y
          # Cart.IntegrationTests.csproj. Con "*.Tests.csproj" no encontraba ninguno y el job
          # salía en verde sin probar nada.
          projects=$(find src -name "*Tests.csproj" -not -path "*/obj/*" -not -path "*/bin/*" | sort)
          count=$(echo "$projects" | grep -c . || true)

          # Candado: si por un cambio de nombres dejamos de encontrar proyectos, el job FALLA
          # en vez de pasar en silencio. 22 = 11 servicios x (unitarios + integración).
          if [ "$count" -lt 22 ]; then
            echo "::error::Se esperaban al menos 22 proyectos de test y se encontraron $count"
            echo "$projects"
            exit 1
          fi
          echo "Proyectos de test encontrados: $count"

          # Se ejecutan TODOS los proyectos aunque alguno falle, y recién al final se falla el job:
          # así una sola corrida lista cada proyecto roto, en vez de mostrar solo el primero.
          failed=""
          for proj in $projects; do
            echo "::group::$proj"
            if ! dotnet test "$proj" --configuration Release --logger "console;verbosity=normal"; then
              failed="$failed$proj"$'\n'
              echo "::error::Fallaron las pruebas de $proj"
            fi
            echo "::endgroup::"
          done

          if [ -n "$failed" ]; then
            echo "::error::Proyectos con fallos:"
            echo "$failed"
            exit 1
          fi

  frontend-unit-tests:
    name: Frontend (${{ matrix.project }}) — Vitest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [admin-panel, storefront]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: ${{ matrix.project }}/pnpm-lock.yaml

      - name: Instalar dependencias
        working-directory: ${{ matrix.project }}
        run: pnpm install --frozen-lockfile

      - name: Correr tests unitarios
        working-directory: ${{ matrix.project }}
        run: pnpm run test:unit

  e2e-tests:
    name: End-to-end (Playwright) — stack completo en Docker
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-unit-tests]
    steps:
      - uses: actions/checkout@v4

      # Claves de prueba, no secretos reales — PAYPAL_PROVIDER=Fake evita necesitar una
      # cuenta de PayPal (ver "Probar el checkout completo sin PayPal real" en el README).
      - name: Crear .env para Docker Compose (solo para este job, nunca se commitea)
        run: |
          cat > .env <<EOF
          ADMIN_PROVISIONING_KEY=ci-admin-key
          ADMIN_PANEL_SITE_KEY=ci-panel-key
          JWT_SECRET=ci-jwt-secret-solo-para-pruebas-1234567890
          PAYPAL_CLIENT_ID=
          PAYPAL_CLIENT_SECRET=
          PAYPAL_PROVIDER=Fake
          RESEND_API_KEY=
          RESEND_FROM_ADDRESS=onboarding@resend.dev
          EOF

      - name: Levantar los 26 servicios
        run: docker compose up -d --build

      - name: Esperar a que el Gateway responda
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5000/api/categories > /dev/null; then
              echo "Gateway listo."
              exit 0
            fi
            echo "Esperando al Gateway... ($i/60)"
            sleep 5
          done
          echo "::error::El Gateway nunca respondió a tiempo."
          exit 1

      - name: Esperar a que Reseñas responda a través del Gateway
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5000/api/reviews/products/00000000-0000-0000-0000-000000000001/summary > /dev/null; then
              echo "Reseñas listo."
              exit 0
            fi
            echo "Esperando a Reseñas... ($i/60)"
            sleep 5
          done
          echo "::error::El servicio de Reseñas nunca respondió a tiempo."
          exit 1

      - name: Esperar a que Favoritos responda a través del Gateway
        run: |
          # Sin token, el servicio sano responde 401. Un 502/503 significa que todavía no arrancó.
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/api/wishlist || true)
            if [ "$code" = "401" ]; then
              echo "Favoritos listo."
              exit 0
            fi
            echo "Esperando a Favoritos... ($i/60, HTTP $code)"
            sleep 5
          done
          echo "::error::El servicio de Favoritos nunca respondió a tiempo."
          exit 1

      - name: Esperar a que Cupones responda a través del Gateway
        run: |
          # Igual que Favoritos: sin token, el servicio sano responde 401.
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:5000/api/coupons/validate?code=X&subtotal=1" || true)
            if [ "$code" = "401" ]; then
              echo "Cupones listo."
              exit 0
            fi
            echo "Esperando a Cupones... ($i/60, HTTP $code)"
            sleep 5
          done
          echo "::error::El servicio de Cupones nunca respondió a tiempo."
          exit 1

      - name: Esperar a que Lealtad (puntos) responda a través del Gateway
        run: |
          # Igual que Favoritos: sin token, el servicio sano responde 401.
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/api/loyalty/me || true)
            if [ "$code" = "401" ]; then
              echo "Lealtad (puntos) listo."
              exit 0
            fi
            echo "Esperando a Lealtad (puntos)... ($i/60, HTTP $code)"
            sleep 5
          done
          echo "::error::El servicio de Lealtad (puntos) nunca respondió a tiempo."
          exit 1

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: e2e/pnpm-lock.yaml

      - name: Instalar Playwright y sus navegadores
        working-directory: e2e
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Correr los tests end-to-end
        working-directory: e2e
        env:
          STOREFRONT_URL: http://localhost:5173
          ADMIN_PANEL_URL: http://localhost:8081
          GATEWAY_URL: http://localhost:5000
          ADMIN_PANEL_SITE_KEY: ci-panel-key
          ADMIN_PROVISIONING_KEY: ci-admin-key
        run: pnpm test

      - name: Logs de los servicios (si algo falló)
        if: failure()
        run: docker compose logs --tail 100

      - name: Subir el reporte de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Apagar el stack
        if: always()
        run: docker compose down -v
